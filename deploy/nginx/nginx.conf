worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Keep the upstream trace context visible in the access log so a request
    # can be followed from the edge to Gate/Jaeger.
    log_format with_trace '$remote_addr - $request "$status" trace=$http_traceparent';
    access_log /var/log/nginx/access.log with_trace;

    # Two zones: a strict one for credential endpoints, a looser one for the
    # rest of the API. 429 is easier to assert and to document than the
    # nginx default 503.
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
    limit_req_status 429;

    upstream gate_server {
        server host.docker.internal:18080;
        keepalive 32;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 2m;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";

        location = /user_login {
            limit_req zone=login_zone burst=5 nodelay;
            proxy_pass http://gate_server;
        }

        location = /oauth/token {
            limit_req zone=login_zone burst=3 nodelay;
            proxy_pass http://gate_server;
        }

        location / {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://gate_server;
        }
    }
}
