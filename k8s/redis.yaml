apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: im-redis:v1
          imagePullPolicy: Never
          command: ["redis-server", "--requirepass", "123456", "--port", "6380"]
          ports:
            - containerPort: 6380
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6380
      targetPort: 6380
