name: im-test

services:
  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: chat_system_test
      MYSQL_USER: chatuser
      MYSQL_PASSWORD: test
    ports:
      - "13306:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
      - ./deploy/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ptest"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "test", "--port", "6380"]
    ports:
      - "16380:6380"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "test", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka-test:
    image: apache/kafka:3.8.0
    profiles: ["kafka"]
    ports:
      - "19092:19092"
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-test:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-test:9092,EXTERNAL://127.0.0.1:19092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  etcd-test:
    image: quay.io/coreos/etcd:v3.5.17
    profiles: ["governance"]
    command:
      - etcd
      - --name=etcd-test
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-test:2379
    ports:
      - "12379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  jaeger-test:
    # Jaeger v2 is the single-binary distribution; it exposes OTLP/HTTP on
    # 4318, OTLP/gRPC on 4317 and the query UI on 16686 out of the box.
    image: jaegertracing/jaeger:2.6.0
    profiles: ["observability"]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus-test:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    ports:
      - "19090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana-test:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus-test
      - jaeger-test

volumes:
  mysql_test_data:
