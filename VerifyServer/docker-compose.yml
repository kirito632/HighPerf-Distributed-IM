version: "3.9"

services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass 123456 --port 6380
    ports:
      - "6381:6380"    # 宿主机用 6381 避免冲突，容器内仍是 6380
    volumes:
      - redis_data:/data

  verify-server:
    build: .
    ports:
      - "50051:50051"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6380
      - REDIS_PASS=123456
    depends_on:
      - redis

volumes:
  redis_data:
